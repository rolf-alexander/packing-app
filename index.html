<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Packlist</title>
  <meta name="description" content="Gear inventory, packing lists, pre-tour checks and trip admin. Works offline.">
  <meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1218" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Packlist">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved light/dark choice before the page draws, to avoid a flash.
    try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view"><div class="loading">Loading…</div></main>
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
